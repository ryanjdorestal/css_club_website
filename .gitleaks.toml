# gitleaks — extends the default ruleset; our own patterns; allowlist by NAME only.
title = "jjay_css secret scan"
[extend]
useDefault = true

[[rules]]
id = "supabase-service-key-jwt"
description = "Supabase service_role / anon JWT pasted as a value"
regex = '''eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "discord-webhook"
description = "Discord webhook URL"
regex = '''discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9_-]{30,}'''

[allowlist]
description = "Names of env vars and example placeholders are fine; values are not."
paths = [ '''docs/archive/.*''', '''qa/.*''', '''package-lock\.json''', '''\.gitleaks\.toml''' ]
regexes = [ '''SUPABASE_[A-Z_]+''', '''VITE_SUPABASE_[A-Z_]+''', '''you@jjay\.cuny\.edu''', '''example\.(org|com)''', '''***REMOVED***''' ]
