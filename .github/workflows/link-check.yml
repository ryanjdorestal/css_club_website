name: link-check
# Weekly lychee sweep over the built site, data/*.json and content/**/*.md (+ on demand).
on:
  schedule: [{ cron: "0 8 * * 1" }]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc }
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/apps/web/dist --no-progress 'apps/web/dist/**/*.html' 'data/*.json' 'content/**/*.md' 'README.md' 'docs/*.md'
          fail: true
