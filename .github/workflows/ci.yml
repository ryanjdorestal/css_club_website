name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the snapshot workflow dispatches CI on its PR branch (GITHUB_TOKEN-made PRs get no automatic run)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Exactly what `make check` runs on a laptop, plus the build and the render smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: install
        run: |
          npm ci --prefix apps/web
          python -m venv .venv && .venv/bin/pip install -q -r api/requirements.txt -r scripts/requirements-dev.txt

      - name: make check (lint · format · css · md · types · tests · audit · one-function guard · validators · dead code)
        run: make check
      - name: commit messages are conventional (commitlint)
        run: |
          FROM="${{ github.event.pull_request.base.sha || github.event.before }}"
          # a first push (before = 0000…) or a dispatch has no range: lint the head commit alone
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then FROM="${{ github.sha }}~1"; fi
          cd apps/web && npx commitlint --from "$FROM" --to "${{ github.sha }}" --verbose
      - name: generated types are current
        run: |
          .venv/bin/python scripts/gen_types.py
          git diff --exit-code apps/web/src/lib/api.types.ts
      - name: build
        run: npm run build --prefix apps/web
      - name: html-validate (index.html + built page)
        run: npm run lint:html --prefix apps/web
      - name: playwright smoke (every route renders, Tier 1)
        run: |
          npx playwright install --with-deps chromium
          node qa-scripts/smoke.mjs
        working-directory: apps/web

      # Optional: prove the deploy would succeed. Skips when no token is set.
      - name: vercel build dry-run (one function in the output)
        if: ${{ vars.VERCEL_DRY_RUN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel build --token "$VERCEL_TOKEN" || { echo "::warning::vercel build dry-run failed"; exit 0; }
          n=$(find .vercel/output/functions -maxdepth 1 -name '*.func' | wc -l); echo "functions: $n"; [ "$n" -le 1 ]

  functional:
    # A board member's day, end to end, against the dev server + API (Tier 1, no accounts):
    # the OS gate (12 checks), the 9-step functional smoke, the 25-step board simulation and the 16-case break pass. All must pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - run: npm ci --prefix apps/web && python -m venv .venv && .venv/bin/pip install -q -r api/requirements.txt
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - name: start web + api (Tier 1)
        run: |
          (.venv/bin/uvicorn api.index:app --port 8000 &) ; (npm run dev --prefix apps/web -- --port 5173 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:5173/ >/dev/null 2>&1 && curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 && break; sleep 1; done
      - run: make smoke
      # run 10: the semester simulation (25 steps, empty store) and the adversarial pass (16 cases)
      - run: make sim
      - run: make break
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # the screenshots are a convenience, never the gate
        with: { name: smoke-screenshots, path: qa/loops/smoke, retention-days: 7 }
