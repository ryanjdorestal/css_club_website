name: keepalive
# Every 3 days: one real write to Supabase, read back (scripts/keepalive.py), so the free project never
# hits the 7-day inactivity pause — and the database budget check (scripts/db_budget.py) that goes red at
# 70 % of the free tier. Then the live /api/health must answer. Nothing is committed: the OS reads the
# keepalive row from the database and the last run of this workflow from the GitHub API (/os/system → HOSTING).
# Without the secrets each step logs one line and exits 0.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install -q -r api/requirements.txt
      - name: write + read back (the keepalive)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/keepalive.py
      - name: database budget (fails at 70 % of the free tier)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/db_budget.py
      - name: the live site answers
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then echo "::warning::SITE_URL variable not set — live check skipped"; exit 0; fi
          curl -fsS "${{ vars.SITE_URL }}/api/health" | tee health.json
          grep -q '"ok":true' health.json
