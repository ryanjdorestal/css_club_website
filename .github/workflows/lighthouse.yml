name: lighthouse
# Performance budget on the production build (desktop).
#
# What is gated and what is not: a GitHub runner is two shared vCPUs, so the timing-derived numbers
# swing by 40 points between runs (this page scores 97 on a laptop and 0.54 here). Gating on them
# would mean a red check that says nothing, which is worse than no check. So the performance score
# and LCP are recorded as warnings, and the gate is the part a slow machine cannot change: bytes
# shipped, layout shift, accessibility, best practices, SEO. The real numbers go in the job summary.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: npx --prefix apps/web playwright install chromium
      - name: lhci (Playwright's Chromium — the runner's Chrome is newer than Lighthouse 0.15 speaks to)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lhci autorun --config=lighthouserc.json
        working-directory: apps/web
      - name: summary
        if: always()
        run: node ../../scripts/lhci_summary.mjs >> "$GITHUB_STEP_SUMMARY"
        working-directory: apps/web
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: lighthouse-report, path: apps/web/.lighthouseci-report, if-no-files-found: ignore }
