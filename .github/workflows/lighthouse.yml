name: lighthouse
# Performance budget on the production build (desktop). Mobile is recorded, not gated (docs/LATER.md: prerender).
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: npx --prefix apps/web playwright install chromium
      - name: lhci (Playwright's Chromium — the runner's Chrome is newer than Lighthouse 0.15 speaks to)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lhci autorun --config=lighthouserc.json
        working-directory: apps/web
