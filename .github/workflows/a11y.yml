name: a11y
# WCAG 2 AA. axe (Playwright) covers every public route and every OS route signed in as admin;
# pa11y-ci covers the public routes of the shipped bundle. scripts/a11y.sh runs both, starts the
# two servers they each need, and explains why they cannot share one.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v6
        with: { python-version-file: .python-version }
      - run: npm ci --prefix apps/web && python -m venv .venv && .venv/bin/pip install -q -r api/requirements.txt
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm run build --prefix apps/web # pa11y grades this build, not the dev server
      - name: start the api (Tier 1 still passes without it, but the gate should see the real pages)
        run: |
          (.venv/bin/uvicorn api.index:app --port 8000 &)
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 && break; sleep 1; done
      - run: make a11y
      - if: failure()
        run: tail -n 40 /tmp/a11y-dev.log /tmp/a11y-preview.log 2>/dev/null || true
